[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-tp"
version = "0.0.1"
description = "TP Final Cálculo Estocástico — datos de juguete y experimentos de modelos de difusión"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "torch>=2.0",
    "pyyaml>=6",
    "torchvision==0.27.0",
    "pillow>=12.2.0",
    "tqdm>=4.70.0",
    "matplotlib>=3.5",
    "lpips>=0.1.4",
]

[dependency-groups]
analysis = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "pytest>=7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
