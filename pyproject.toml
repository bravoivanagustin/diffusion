[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-tp"
version = "0.0.1"
description = "TP Final Cálculo Estocástico — datos de juguete y experimentos de modelos de difusión"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "torch>=2.0",
    "pyyaml>=6",
    "torchvision==0.27.0",
    "pillow>=12.2.0",
    "tqdm>=4.70.0",
    "matplotlib>=3.5",
    "lpips>=0.1.4",
]

[dependency-groups]
analysis = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "pytest>=7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# En Linux, torch/torchvision salen del índice de PyTorch para CUDA 12.6 en vez de PyPI: el wheel
# de PyPI de torch 2.12 es cu130 y exige un driver más nuevo que el del servidor (error 804 en una
# 3090). Con CUDA 12.x alcanza cualquier driver de la serie 12 (compatibilidad de versión menor).
# Windows sigue usando PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
